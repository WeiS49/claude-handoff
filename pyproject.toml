[project]
name = "claude-handoff"
version = "0.1.0"
description = "Session briefings for Claude Code, derived from ground truth instead of hand-kept notes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
claude-handoff = "claude_handoff.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_handoff"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
